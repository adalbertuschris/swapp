config: project
description: Rules for how code should be generated and structured in project
expectations: 
  - use angular 20
  - create catalogs for modules (replace '.' with '/'), e.g. data.core -> data/core
  - create separate catalogs for models, utils, services, repositories inside each module
  - create separate files for all models, services, repositories
  - create only one utils file per module, named <module>.util.ts (e.g. core.util.ts)
  - use kebab-case for catalog names, files-names
  - use following file naming convention <module>.model.ts, <module>.service.ts, <module>.repository.ts
  - no AI comments in generated files
  - 'create all models as interfaces, unless kind: class is given'
  - create all services as classes
  - create all utils using array functions

schema: injectionTokens
description: >
  all injectionToken is generated by use InjectionToken class from Angular

schema: repository
description: >
  all repository extend RepositoryBase class
  repositories use toHttpParams to transform params
  repositories join baseUrl with url for particular method

schema: store
description: every Store class use this definition
implements: StoreService<TState>
fields:
  _store$:
    type: BehaviorSubject<TState>
    access: private
  state$:
    type: Observable<TState>
    readonly: true
    it:
      - return _store$.asObservable()
getters:
  - name: state
    returns: TState
    it: 
      - return _store.getValue()
methods:
  - name: updateState
    returns: void
    params:
      state: TState
    it:
      - merge with existing state
      - keep state immutable
    hints: shallow merge is enough

module: data.core
models:
  - name: CollectionItemApiResult
    fields:
      uid: string
      name: string
      url: string

  - name: CollectionApiResult
    fields:
      message: string
      totalRecords: number
      totalPages: number
      previous: string # URI
      next: string # URI
      results: CollectionItemApiResult[]

  - name: DetailApiResult<TProperties>
    fields:
      message: string
      result:
        properties: TProperties
        description: string
        _id: string
        uid: string
        __v: number

  - name: CollectionParams
    fields:
      page: number
      limit: number

  - name: CollectionItemResult
    fields:
      uid: string
      name: string
      url: string

  - name: CollectionResult
    fields:
      totalItems: number
      totalPages: number
      items: CollectionItemResult[]

  - name: StoreService<TState>
    fields:
      state$: 
        type: Observable<TState>
        readonly: true
    methods:
      - name: updateState
        returns: void
        params:
          state: TState

utils:
  - name: mapResponseToCamelCase
    it:
      - map object keys from snake_case to camelCase 
      - recursively map nested objects

  - name: mapCollectionApiResultToCollectionResult
    it:
      - map data.core.CollectionApiResult to data.core.ColectionResult
      - handle null or missing values with defaults

  - name: convertStringNumberToNumber
    returns: number
    params:
      str: string
      locale: string = 'en-US'
    it:
      - return 0 when str is equal 'unknown' or 'n/a'
      - parse numeric strings using the provided locale
      - remove non-digit characters (e.g. commas, spaces)
      - convert locale-specific decimal sign to '.'
      - return 0 for invalid input

services: 
  - name: RepositoryBase      
    fields:
      baseUrl: 
        type: string
        value: environment.apiUrl
    dependencies:
      - name: httpClient
        type: HttpClient from Angular
    methods:
      - name: toHttpParams
        it: 
          - convert plain object params into Angular HttpParams instance

module: data.card
models:
  - name: CardProperty
    fields:
      translationKey: string
      value: string
      rawValue: unknown

  - name: Card
    fields:
      title: string
      subtitle: string
      properties: { [key: string]: CardProperty }

  - name: CardPlayer
    fields:
      name: string
      score: number
      win: boolean
      card: Card
      isLoading: boolean

  - name: CardState
    fields:
      player1: CardPlayer
      player2: CardPlayer

  - name: CardRepository
    methods:
      - name: getAll
        returns: Promise<CollectionResult>
        params:
          params: CollectionParams
      - name: get<R = any>
        returns: Promise<R>
        params:
          id: number

store:
  - name: CardStore
    useSchema: store
    state:
      initial:
        player1:
          score: 0
          isLoading: false
          win: false
        player2:
          score: 0
          isLoading: false
          win: false

injectionTokens:
  - name: CARD_REPOSITORY
    type: CardRepository
    useSchema: injectionTokens  
    
services:
  - name: CardService<T>
    singleton: false
    dependencies:
      cardStore: CardStore
      cardRepository: CARD_REPOSITORY
    methods:
      - name: map
        abstract: true
        returns: data.card.Card
        params:
          model: T
        
      - name: compare
        abstract: true
        returns: number
        params:
          card1: data.card.Card
          card2: data.card.Card

      - name: getRandomCard
        description: get random details
        returns: Promise<data.card.Card>
        implementation:
          steps:
            # 'Records in db are not incremental, so first we have to fetch info about total pages (page: 1, limit: 1),
            - fetch total pages by calling cardRepository.getAll(page=1, limit=1)
            - fetch random page with limit 1 - create util to get random page'
            - from fetched list take first item and fetch full details of the random card using cardRepository.get (use uid as id param)
            - map details by using map method

      - name: draw
        returns: void
        implementation:
          steps:
            - set isLoading true for player1 and player2, update state in cardStore
            - draw 2 cards pararelly by using getRandomCard method
            - if success: use compare method to establish who win, update winner’s score, update state in cardStore
            - if failure: set cards null, update state in cardStore

module: data.starship
models:
  - name: StarshipDetailResult
    fields:
      id: string
      model: string
      starshipClass: string
      manufacturer: string
      costInCredits: string
      length: string
      crew: string
      passengers: string
      maxAtmospheringSpeed: string
      hyperdriveRating: string
      mglt: string
      cargoCapacity: string
      consumables: string
      created: string
      edited: string
      name: string
      url: string # URI
  - name: StarshipProps
    fields: keyof StarshipDetailResult

repositories:
  - name: StarshipRepository
    useSchema: repository
    implements: CardRepository
    methods:
      - name: getAll
        returns: Promise<CollectionResult>
        params:
          params: CollectionParams
        method: GET
        url: /starships
      - name: get<StarshipDetailResult>
        returns: Promise<StarshipDetailResult>
        params:
          id: number
        method: GET
        url: /starships/{id}

utils:
  - name: mapToCardProperty
    returns: data.card.CardProperty
    params:
      key: StarshipProps
      value: unknown
    it:
      - generate translationKey by converting key to snake_case, then to uppercase, then prepend converted key by 'CARDS.STARSHIPS.'
      - map value to string and assign to value
      - assign original value to rawValue

  - name: map
    returns: data.card.Card
    params:
      model: StarshipDetailResult
    it: 
      - map StarshipDetailResult to data.card.Card
      - return null if model is null or undefined
      - map model.name to title
      - map model.model to subtitle
      - map model.length, model.starshipClass, model.crew into properties
      - map properties by using mapToCardProperty util

  - name: getPoints
    description: Calculate numeric points for a card based on its 'mass' property
    returns: number
    params:
      card: data.card.Card
    it:
      - convert card.properties['mass'].rawValue to number
      - use data.core.convertStringNumberToNumber util

  - name: compare
    description: Compare two cards points
    returns: number
    params:
      card1: data.card.Card
      card2: data.card.Card
    it:
      - compare points for card1 and card2 
      - use getPoints util to get points for cards
      - return 0 if card1 points == card2 points
      - return 1 if card1 points > card2 points
      - return -1 card1 points < card2 points

services:
  - name: StarshipService
    extends: CardService
    methods:
      - name: map
        returns: data.card.Card
        params:
          model: StarshipDetailResult
        it:
          - use map util

      - name: compare
        returns: number
        params:
          card1: data.card.Card
          card2: data.card.Card
        it:
          - use compare util

providers:
  - name: STARSHIP_PROVIDERS
    returns: Provider[]
    array:
      - { provide: CARD_REPOSITORY, useClass: StarshipRepository }
      - StarshipService